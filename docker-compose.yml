# Local and single-host deployment: API + web front (nginx proxies /cases, /config, and /health to API).
# For registry images after CI, set API_IMAGE and WEB_IMAGE then use compose override or
# `docker compose pull` once those images exist on GHCR.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - apps/api/.env.dockerfile
    environment:
      # Overrides env_file when the same key is set (container paths / OCR).
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_ROOT: /data/storage
      TESSERACT_CMD: /usr/bin/tesseract
      TESSDATA_PREFIX: /tessdata
    volumes:
      - api-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT:-8001}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
