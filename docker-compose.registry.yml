# Pull-only stack for a host that runs images from GHCR (after CI publishes them).
#
#   export API_IMAGE=ghcr.io/<owner>/<repo>-api:latest
#   export WEB_IMAGE=ghcr.io/<owner>/<repo>-web:latest
#   docker compose -f docker-compose.registry.yml up -d
#
# Defaults are placeholders; you must set API_IMAGE and WEB_IMAGE.

services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to your GHCR API image, e.g. ghcr.io/org/repo-api:latest}
    environment:
      DATABASE_URL: sqlite:////data/app.db
      STORAGE_ROOT: /data/storage
    volumes:
      - api-data:/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to your GHCR web image, e.g. ghcr.io/org/repo-web:latest}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  api-data:
